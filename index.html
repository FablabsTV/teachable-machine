
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Meine sprechende Teachable Machine</title>
</head>
<body>

<h2>Meine sprechende Teachable Machine</h2>

<button type="button" onclick="init()">Start</button>

<div id="webcam-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/Uypb2d_LK/";

let model, webcam, labelContainer, maxPredictions;
let letzterText = "";
let schonGesprochen = false;
async function init() {

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(200, 200, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam-container").appendChild(webcam.canvas);

    labelContainer = document.getElementById("label-container");

    for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
    }

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {

    const prediction = await model.predict(webcam.canvas);

    let beste = prediction[0];

    for (let i = 0; i < maxPredictions; i++) {

        if (prediction[i].probability > beste.probability) {
            beste = prediction[i];
        }

        labelContainer.childNodes[i].innerHTML =
            prediction[i].className + ": " +
            prediction[i].probability.toFixed(2);
    }

    if (beste.probability > 0.90) {

  if (beste.className !== letzterText && !schonGesprochen) {

            letzterText = beste.className;

            const stimme = new SpeechSynthesisUtterance(
                "Hallo! Ich habe " + beste.className + " erkannt!"
            );

            stimme.lang = "de-DE";
           window.speechSynthesis.speak(stimme);
schonGesprochen = true;
}
} else {
    letzterText = "";

}

</script>
</body>
</html>
